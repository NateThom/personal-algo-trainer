<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlgoTrainer</title>
  <link rel="stylesheet" href="/static/vendor/codemirror/codemirror.min.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header><h1>AlgoTrainer</h1><span id="stats"></span><span id="pattern-badge"></span></header>
  <p class="firstrun">New here? Start with the <a href="/guide">Guide</a> and the <a href="/methodology">Methodology</a>.</p>
  <main>
    <section id="problem">
      <h2 id="title">Loading… <span id="seen-badge"></span></h2>
      <p id="statement"></p>
    </section>
    <section id="recall">
      <h3>Before you code — recall gate</h3>
      <label>Which pattern is this? <input id="r-pattern" /></label>
      <label>Approach (2–4 sentences): <textarea id="r-approach"></textarea></label>
      <label>Predicted time/space complexity: <input id="r-complexity" /></label>
      <p class="note">Not sure which pattern? <a href="/patterns">Browse the Pattern Library</a></p>
    </section>
    <section id="editor-wrap">
      <textarea id="editor"></textarea>
      <div class="actions">
        <button id="hint">Get hint</button>
        <button id="run">Run tests</button>
        <button id="handoff" disabled>Send to tutor</button>
        <button id="ingest" disabled>Ingest verdict</button>
      </div>
      <pre id="results"></pre>
      <div id="hints"></div>
    </section>
    <section id="mastery">
      <h3>Pattern mastery</h3>
      <div id="mastery-body">No data yet — solve a problem.</div>
    </section>
  </main>
  <script src="/static/vendor/codemirror/codemirror.min.js"></script>
  <script src="/static/vendor/codemirror/mode/python/python.min.js"></script>
  <script src="/static/nav.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
